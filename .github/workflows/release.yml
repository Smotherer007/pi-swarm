name: Release

on:
  push:
    branches:
      - main
      - next
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is required - semantic-release walks the full tag and
      # commit history to work out the next version.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: "npm"

      - run: npm ci

      - run: npm run build

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release

      # semantic-release reports success even when the npm plugin decides not to
      # publish, because "skip" is a normal log line there and not an error. That
      # is how a tagged release could go missing without anyone noticing.
      #
      # Checking the version list would be the wrong test: the packument lags
      # behind a publish for a minute or two, which is long enough to look like a
      # failed release -- that mistake was made twice while testing this. So the
      # artifact itself is requested, with retries.
      - name: Verify the version really reached npm
        run: |
          set -u
          NAME="@patimweb/pi-swarm"
          VERSION=$(node -p "require('./package.json').version")
          TARBALL="https://registry.npmjs.org/${NAME}/-/${NAME##*/}-${VERSION}.tgz"
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$TARBALL" || echo 000)
            if [ "$code" = "200" ]; then
              echo "npm serves $NAME@$VERSION"
              exit 0
            fi
            echo "attempt $attempt: HTTP $code for $TARBALL"
            sleep 10
          done
          echo "::error::package.json is at $VERSION but its tarball is not on npm after a minute. Check the release log for 'Skip publishing to npm registry' and the NPM_TOKEN secret."
          exit 1
