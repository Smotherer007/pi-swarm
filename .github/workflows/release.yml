name: Release

on:
  push:
    branches:
      - main
      - next
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is required - semantic-release walks the full tag and
      # commit history to work out the next version.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: "npm"

      - run: npm ci

      - run: npm run build

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release

      # A guard, not a gate. Publishing has worked for every version so far, and
      # this step cannot tell "publish skipped" from "the release step failed
      # after publishing", so failing the job here produced false red runs.
      # It still writes the facts into the log, which the log alone would hide:
      # the artifact is requested directly, with retries, because the packument
      # lags behind a publish long enough to look like a missing release.
      - name: Report whether the version is on npm
        if: always()
        run: |
          set -u
          NAME="@patimweb/pi-swarm"
          VERSION=$(node -p "require('./package.json').version")
          TARBALL="https://registry.npmjs.org/${NAME}/-/${NAME##*/}-${VERSION}.tgz"
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$TARBALL" || echo 000)
            if [ "$code" = "200" ]; then
              echo "npm serves $NAME@$VERSION"
              exit 0
            fi
            echo "attempt $attempt: HTTP $code for $TARBALL"
            sleep 10
          done
          echo "::warning::package.json is at $VERSION and its tarball is not on npm. Check the release log for 'Skip publishing to npm registry', the NPM_TOKEN secret, and whether the Release step above failed."
